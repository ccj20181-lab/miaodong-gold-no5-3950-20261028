<!doctype html><meta charset="utf-8"><style>body{background:#172432;color:#fff;font:20px sans-serif}video{width:80vw;max-height:80vh}button{font:24px sans-serif}pre{white-space:pre-wrap}</style><h2>NO.5 素材正常速度拟用区间检查</h2><button id="start">开始播放</button><p id="label"></p><video muted playsinline></video><pre id="report"></pre><script>let rows,idx=0;const v=document.querySelector('video');window.sourcePlayback={started:null,completed:false,ranges:[],errors:[]};fetch('../production/'+(new URLSearchParams(location.search).get('list')||'source-review-ranges.json')).then(r=>r.json()).then(j=>{const only=new URLSearchParams(location.search).get("only");rows=only?j.filter(x=>x.id===only):j});async function next(){if(idx>=rows.length){sourcePlayback.completed=true;sourcePlayback.ended=new Date().toISOString();document.querySelector('#report').textContent=JSON.stringify(sourcePlayback,null,2);return}const r=rows[idx];document.querySelector('#label').textContent=(idx+1)+'/'+rows.length+' '+r.id;v.src='../'+r.path;await new Promise(resolve=>{v.onloadedmetadata=resolve});v.currentTime=r.from;await v.play();sourcePlayback.ranges.push({id:r.id,start:r.from,duration:r.duration,started:performance.now(),rate:v.playbackRate})}v.ontimeupdate=()=>{if(!rows||idx>=rows.length)return;const r=rows[idx];if(v.currentTime>=r.from+r.duration){const log=sourcePlayback.ranges.at(-1);log.actualEnd=v.currentTime;log.wallSeconds=(performance.now()-log.started)/1000;v.pause();idx++;next()}};v.onerror=()=>sourcePlayback.errors.push(v.error?.message);document.querySelector('#start').onclick=()=>{sourcePlayback.started=new Date().toISOString();next()};</script>
